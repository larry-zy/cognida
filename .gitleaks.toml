# gitleaks 配置：仓库级密钥扫描门（〔INF-13〕，见 .github/workflows/ci-security.yml）。
#
# 用「路径/正则允许清单」替代原来的 .gitleaksignore 指纹清单：
# 指纹是 <commit>:<file>:<rule>:<line>，一旦 git 历史被 rebase/filter 重写（哈希变化）
# 就会整体失配、把已核实的示例值重新报成泄漏——这正是 2026-08 link→cognida 收敛后门禁失败的原因。
# 按「内容/路径」豁免则不随历史重写失效。
#
# 原则：真实凭证一律去源头吊销轮换，绝不在此豁免；此处仅豁免已核实的示例/测试假密钥，
#       以及仅遗留于历史提交、无法从工作树消除的路径。

[extend]
useDefault = true

[allowlist]
description = "已核实的示例/测试假密钥与仅存于历史的路径（非真实凭证）"

# regexes 正则匹配「命中的密钥值」。命中即豁免，不随历史重写失效，且比按路径豁免更精准。
regexes = [
  # config_test.go 里 t.Setenv 用的测试环境变量名常量：generic-api-key 规则误判
  #   `const key = "COGNIDA_TEST_INT64"` 为泄漏。非真实凭证，仅豁免该固定字面量。
  '''COGNIDA_TEST_INT64''',
]

# paths 正则匹配「命中文件的路径」。命中即豁免，覆盖该文件在全部历史提交中的匹配。
paths = [
  # 1) 代码评审提示文档：演示"硬编码密钥=反模式"的占位示例值。
  '''\.claude/hooks/bug-detection\.md''',

  # 1b) 脱敏逻辑单测：故意内嵌假 token 以验证错误信息中的密钥被打码。
  '''services/cognida-go/internal/model/llm/error_test\.go''',

  # 2) 集成测试用 apiKey：旧路径 link-go/ 与重命名后的 services/cognida-go/ 均豁免。
  #    该值已从工作树移除；若确认为真实凭证，须在源头吊销轮换（豁免只为放行历史门禁）。
  '''(?:link-go|services/cognida-go)/internal/service/agent/rag_integration_test\.go''',

  # 3) 本配置文件与旧的 .gitleaksignore：其注释中出现示例字面量，避免自我误报。
  '''(?:^|/)\.gitleaks\.toml$''',
  '''(?:^|/)\.gitleaksignore$''',
]

# CI 8.21.2 将下面两份固定验收证据里的摘要误判为 generic-api-key；
# 新版扫描器还会命中集成测试中的两个对象路径。它们均不是鉴权凭据。
# 仅扩展该规则的例外；路径 AND 完整行必须同时匹配，不豁免整个文件或任意 SHA-256。
# 每个摘要/对象路径均固定为已核实值，回归检查见 .github/scripts/check-gitleaks-config.py。
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "固定迁移文件的真实 SHA-256，与 SQL 文件字节核对"
condition = "AND"
regexTarget = "line"
paths = ['''(?:^|/)apps/cognida\-web/e2e/evidence/2026\-10\-16\-migrations\-16\-35\.json$''']
regexes = [
  '''^\s*"000026_api_ingestion\.up\.sql"\s*:\s*"86f84017c1cd6e97706cf7fed2b9ea7d697f70fb8d0e9d082ada83035b4a1c5e",?\s*$''',
  '''^\s*"000026_api_ingestion\.down\.sql"\s*:\s*"f897a9aa9b024d717ce12a4868bc8986fc88d347e8b4879082a2f6a5110ba3e0",?\s*$''',
]

[[rules.allowlists]]
description = "固定任务重启证据中的幂等摘要，由任务身份 SHA-256 派生"
condition = "AND"
regexTarget = "line"
paths = ['''(?:^|/)apps/cognida\-web/e2e/evidence/2026\-10\-15\-task\-runtime\-restart\.json$''']
regexes = [
  '''^\s*"operation_key"\s*:\s*"380463dc47fdcaaa69df9b1fa79ec158dfca6ef4e5e877bf5d9037d5005ed528",?\s*$''',
  '''^\s*"operation_key"\s*:\s*"77f7548d9b31776e3f8a375e0f37c17cff4555b26f5ca8dabc65abc956a5e2ff",?\s*$''',
  '''^\s*"operation_key"\s*:\s*"9f98238349465accde24c5d3f3952222656d79f9c81d90e5f3ac368324a2ad5b",?\s*$''',
  '''^\s*"operation_key"\s*:\s*"a771be20a3e5edaa9ae0e7a293025399d41444efe448ceb0bc5122e0aa1df1c3",?\s*$''',
]

[[rules.allowlists]]
description = "集成测试的固定对象存储路径，不是访问凭据"
condition = "AND"
regexTarget = "line"
paths = ['''(?:^|/)services/cognida\-go/internal/repository/mysql/collection_repo_integration_test\.go$''']
regexes = [
  '''^\s*item\.RawObjectKey = "collection/7001/fixture/raw"\s*$''',
  '''^\s*item\.NormalizedObjectKey = "collection/7001/fixture/normalized"\s*$''',
]
