[project]
name = "link-python"
version = "0.1.0"
description = "Python工具服务 - 通过MCP+gRPC为Go服务提供能力增强"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    # MCP 协议
    "mcp>=0.9.0",
    "aiohttp>=3.10.0",  # HTTP MCP Server 需要
    # gRPC 协议
    "grpcio>=1.62.0",
    "grpcio-health-checking>=1.8.0",
    "protobuf>=5.28.0",
    # LLM 客户端
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "hiredis>=2.0.0",
    "redis>=5.0.0",
    "httpx>=0.28.0",
    # 数据处理
    "numpy>=2.0.0",
    "datasets>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "grpcio-tools>=1.62.0",
]
test = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]
# 评测工具
evaluation = [
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.5.0",
    "openai>=1.0.0",
    "jieba>=0.42.1",
    "rouge-chinese>=1.0.3",
]
# 文档处理
document = [
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "paddleocr>=2.8.0",
    "pillow>=11.0.0",
    "beautifulsoup4>=4.12.0",
]
# 数据收集
collection = [
    "aiohttp>=3.10.0",
    "playwright>=1.45.0",
    "beautifulsoup4>=4.12.0",
]
# 数据质量
quality = [
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "pyarrow>=12.0.0",
    "pyyaml>=6.0",
    "regex>=2023.0.0",
    "chardet>=5.0.0",
    "datasketch>=1.6.0",
]
# 数据分析
analytics = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
]
# 图像工具 (gRPC)
image = [
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "pillow>=11.0.0",
    "clip>=0.1.0",
]
all = [
    "link-python[dev,test,evaluation,document,collection,image,quality,analytics]",
]

[project.scripts]
link-python-mcp = "mcp.server:main"
link-python-grpc = "grpc_service.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "tools",
    "core",
    "services",
    "config",
    "mcp",
    "grpc_service",
    "api",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["tools", "services", "config", "core", "mcp", "grpc_service", "api", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "grpc: marks tests that require gRPC server to be running",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
