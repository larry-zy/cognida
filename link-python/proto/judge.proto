syntax = "proto3";

package judge;

// LLM 评测服务
service JudgeService {
    // 上报评测进度（单向流）
    rpc ReportProgress(stream ProgressUpdate) returns (ProgressResponse);

    // 提交评测结果
    rpc SubmitResult(EvaluationResult) returns (ResultResponse);

    // 获取可用数据集列表
    rpc ListDatasets(ListDatasetsRequest) returns (ListDatasetsResponse);

    // 获取数据集详情
    rpc GetDataset(GetDatasetRequest) returns (DatasetInfo);

    // 健康检查
    rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// ===== 进度上报相关 =====

message ProgressUpdate {
    string task_id = 1;              // 任务 ID
    TaskStatus status = 2;           // 任务状态
    int32 progress = 3;              // 进度百分比 (0-100)
    string stage = 4;                // 当前阶段: queuing, inferring, scoring, completed, failed
    int32 current_sample = 5;        // 当前样本索引
    int32 total_samples = 6;         // 总样本数
    string message = 7;              // 状态消息
    int64 timestamp = 8;             // 时间戳
}

message ProgressResponse {
    bool accepted = 1;               // 是否接受
    string message = 2;              // 响应消息
}

enum TaskStatus {
    UNKNOWN = 0;
    PENDING = 1;                     // 待处理
    QUEUED = 2;                      // 队列中
    RUNNING = 3;                     // 执行中
    SCORING = 4;                     // 评分中
    COMPLETED = 5;                   // 已完成
    FAILED = 6;                      // 失败
}

// ===== 结果提交相关 =====

message EvaluationResult {
    string task_id = 1;              // 任务 ID
    int32 total_samples = 2;         // 总样本数
    int32 scored_samples = 3;        // 已评分样本数

    // 聚合指标
    double avg_score = 4;            // 平均分
    double pass_rate = 5;            // 通过率
    int64 total_tokens = 6;          // 总 token 使用量
    int64 total_latency_ms = 7;      // 总延迟（毫秒）

    // 样本详细结果
    repeated SampleResult samples = 8;

    // 元数据
    int64 started_at = 9;            // 开始时间
    int64 completed_at = 10;         // 完成时间
    string error_message = 11;       // 错误信息（失败时）
}

message SampleResult {
    int32 sample_index = 1;          // 样本索引
    string model_output = 2;         // 模型输出
    double score = 3;                // 分数
    bool passed = 4;                 // 是否通过
    string reason = 5;               // 评分理由
    int32 latency_ms = 6;            // 延迟（毫秒）
    int64 prompt_tokens = 7;         // Prompt tokens
    int64 completion_tokens = 8;     // Completion tokens
}

message ResultResponse {
    bool accepted = 1;               // 是否接受
    string result_id = 2;            // 结果 ID
    string message = 3;              // 响应消息
}

// ===== 数据集相关 =====

message ListDatasetsRequest {
    // 空请求
}

message ListDatasetsResponse {
    repeated DatasetInfo datasets = 1;
}

message GetDatasetRequest {
    string dataset_id = 1;           // 数据集 ID
}

message DatasetInfo {
    string dataset_id = 1;           // 数据集 ID
    string name = 2;                 // 数据集名称
    string description = 3;          // 描述
    int32 sample_count = 4;          // 样本数量
    repeated string fields = 5;      // 数据字段 (如: question, answer, context)
    map<string, string> metadata = 6; // 元数据
    int64 created_at = 7;            // 创建时间
    int64 updated_at = 8;            // 更新时间
}

// ===== 健康检查 =====

message HealthCheckRequest {
    // 空请求
}

message HealthCheckResponse {
    enum ServingStatus {
        UNKNOWN = 0;
        SERVING = 1;
        NOT_SERVING = 2;
    }
    ServingStatus status = 1;
    string version = 2;              // 服务版本
}
