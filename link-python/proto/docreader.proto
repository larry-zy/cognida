syntax = "proto3";

package docreader;

// 文档解析服务
service DocumentReaderService {
    // ===== 文档解析 =====
    rpc ParseDocument(ParseRequest) returns (ParseResponse);
    rpc ParseBatch(ParseBatchRequest) returns (ParseBatchResponse);

    // ===== OCR 识别 =====
    rpc OCRImage(OCRRequest) returns (OCRResponse);
    rpc OCRBatch(OCRBatchRequest) returns (stream OCRBatchResponse);

    // ===== 文档分块 =====
    rpc ChunkDocument(ChunkRequest) returns (ChunkResponse);

    // ===== URL 内容获取 =====
    rpc FetchURL(FetchURLRequest) returns (FetchURLResponse);
}

// ===== 文档解析相关 =====

message ParseRequest {
    oneof source {
        string file_path = 1;      // 文件路径
        string url = 2;            // URL
        bytes content = 3;         // 直接内容
    }
    string format = 4;             // 格式（自动检测或指定：pdf, docx, xlsx, csv, md, txt）
    ParseOptions options = 5;
}

message ParseOptions {
    bool include_metadata = 1;     // 是否包含元数据
    bool extract_tables = 2;       // 是否提取表格
    bool extract_images = 3;       // 是否提取图片
    string ocr_engine = 4;         // OCR 引擎：paddleocr | vlm
    string language = 5;           // OCR 语言：chi_sim | eng
}

message ParseResponse {
    bool success = 1;
    string text = 2;               // 提取的文本
    DocumentMetadata metadata = 3;
    repeated TableData tables = 4;  // 提取的表格
    repeated ImageInfo images = 5;  // 提取的图片信息
    string error = 6;
}

message DocumentMetadata {
    string format = 1;             // 文档格式
    int32 page_count = 2;          // 页数
    int32 char_count = 3;          // 字符数
    map<string, string> properties = 4;  // 其他属性
}

message TableData {
    int32 page = 1;
    int32 table_index = 2;
    repeated Row rows = 3;
    string markdown = 4;           // Markdown 格式
}

message Row {
    repeated string cells = 1;
}

message ImageInfo {
    int32 page = 1;
    int32 image_index = 2;
    string path = 3;               // 图片保存路径（如果提取）
    int32 width = 4;
    int32 height = 5;
}

message ParseBatchRequest {
    repeated ParseRequest requests = 1;
}

message ParseBatchResponse {
    repeated ParseResponse responses = 1;
}

// ===== OCR 相关 =====

message OCRRequest {
    oneof source {
        string file_path = 1;
        bytes image_data = 2;
        string url = 3;
    }
    string engine = 4;             // paddleocr | vlm
    string language = 5;           // chi_sim | eng
    OCROptions options = 6;
}

message OCROptions {
    bool det = 1;                  // 是否检测方向
    bool rec = 2;                  // 是否识别文字
    bool use_cls = 3;              // 是否使用方向分类
    bool return_details = 4;       // 是否返回详细信息
}

message OCRResponse {
    bool success = 1;
    string text = 2;
    repeated OCRBlock blocks = 3;  // 详细信息
    double confidence = 4;
    string error = 5;
}

message OCRBlock {
    Rect box = 1;                  // 文本框位置
    string text = 2;
    double confidence = 3;
}

message Rect {
    int32 x = 1;
    int32 y = 2;
    int32 width = 3;
    int32 height = 4;
}

message OCRBatchRequest {
    repeated OCRRequest requests = 1;
}

message OCRBatchResponse {
    int32 index = 1;
    OCRResponse response = 2;
}

// ===== 文档分块相关 =====

message ChunkRequest {
    string text = 1;               // 待分块的文本
    ChunkStrategy strategy = 2;    // 分块策略
    ChunkOptions options = 3;
}

enum ChunkStrategy {
    PARAGRAPH = 0;                 // 按段落分块
    SENTENCE = 1;                  // 按句子分块
    FIXED_SIZE = 2;                // 固定大小
    SEMANTIC = 3;                  // 语义分块
    RECURSIVE = 4;                 // 递归分块
}

message ChunkOptions {
    int32 chunk_size = 1;          // 块大小（字符数）
    int32 chunk_overlap = 2;       // 重叠大小
    string separator = 3;          // 分隔符
    int32 min_chunk_size = 4;      // 最小块大小
}

message ChunkResponse {
    repeated Chunk chunks = 1;
    int32 total_count = 2;
}

message Chunk {
    string text = 1;
    int32 index = 2;
    int32 start_pos = 3;
    int32 end_pos = 4;
    map<string, string> metadata = 5;
}

// ===== URL 获取相关 =====

message FetchURLRequest {
    string url = 1;
    FetchOptions options = 2;
}

message FetchOptions {
    int32 timeout = 1;             // 超时时间（秒）
    bool wait_for_javascript = 2;  // 是否等待 JS 执行
    int32 wait_time = 3;           // 等待时间（毫秒）
    bool screenshot = 4;           // 是否截图
}

message FetchURLResponse {
    bool success = 1;
    string text = 2;               // 提取的文本
    string html = 3;               // 原始 HTML
    string title = 4;              // 页面标题
    repeated string links = 5;      // 页面链接
    bytes screenshot = 6;          // 截图
    string error = 7;
}
