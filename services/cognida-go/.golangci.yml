# golangci-lint 配置 (v1.60+)
# 棕地项目: 先启用一组高信噪比的核心 linter, 避免一次性铺满导致无法落地。
run:
  timeout: 10m
  tests: true
  # 根因: 官方发行版 golangci-lint v1.64.8 由 go1.24 构建, 分析 go1.25 代码时读不了 go1.25 工具链的
  # export data(格式随 Go 版本变), 只能把整棵依赖闭包(eino/milvus/neo4j/grpc)从源码在进程内
  # 重新类型检查 + 全部 SSA 驻留 → 存活峰值 ~15-16GB 顶死 16GB CI runner。修法见 ci-go.yml:
  # CI 改用 `go install ...@v1.64.8` 用 go1.25 工具链现编 golangci-lint, 版本对齐后复用 export data,
  # 峰值回落到 ~2GB(与本地 go1.26 编的二进制一致)。故无需再降并行/钉 go 版本。
  concurrency: 2

linters:
  disable-all: true
  enable:
    - errcheck      # 未处理的 error
    - govet         # go vet
    - ineffassign   # 无效赋值
    - staticcheck   # 静态分析
    - unused        # 未使用的代码
    - gosimple      # 可简化的写法
    - misspell      # 拼写
    - bodyclose     # HTTP body 未关闭
    - gosec         # 安全问题

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # 测试文件放宽安全/错误检查
    - path: _test\.go
      linters:
        - gosec
        - errcheck
    # 生成代码(gRPC/wire)不检查
    - path: \.pb\.go
      linters:
        - all
    - path: wire_gen\.go
      linters:
        - all
    # gRPC 客户端迁移（DialContext/WithBlock→NewClient、otelgrpc 拦截器→NewClientHandler）
    # 涉及连接语义变化（懒连接、启动即校验连通丢失），需专项验证后再动，暂定向豁免其 SA1019。
    # 其余 SA1019（ChatModel / go-redis）已全部迁移清零。
    - path: internal/infrastructure/grpc/
      text: "SA1019"
      linters:
        - staticcheck

linters-settings:
  gosec:
    excludes:
      - G115  # 整型转换溢出(存量误报多, 单独处理)
