# golangci-lint 配置 (v1.60+)
# 棕地项目: 先启用一组高信噪比的核心 linter, 避免一次性铺满导致无法落地。
run:
  timeout: 10m
  tests: true
  # CI 实测(ci-go.yml 内存监控实锤): unused linter 做全程序死代码分析, 必须把整棵依赖闭包
  # (eino/milvus/neo4j/grpc 等巨型库)的 SSA 同时驻留内存, 存活峰值 ~15-16GB, 顶死 16GB runner →
  # 内存看门狗 SIGTERM 杀步(exit 143)。concurrency/timeout/tests:false 均无法封顶存活内存。
  # 已将 unused 从 enable 列表移除(见 linters 段注释), 其余 linter 逐包分析内存小; concurrency=2 兜底。
  concurrency: 2
  # golangci-lint(latest 发行版)当前由 go1.24 构建, 若目标版本取自 go.mod 的 go1.25.8
  # 会因"构建版本 < 目标版本"直接拒绝运行。显式将分析目标钉到 1.24 以对齐二进制构建版本;
  # 待 golangci-lint 发行版跟进 go1.25 后可移除本行(或随 action 升级到 v2)。
  go: "1.24"

linters:
  disable-all: true
  enable:
    - errcheck      # 未处理的 error
    - govet         # go vet
    - ineffassign   # 无效赋值
    - staticcheck   # 静态分析
    # - unused      # 全程序死代码分析: 需驻留整棵依赖闭包 SSA(~15-16GB), 顶死 16GB CI runner →
    #                 内存看门狗 SIGTERM(见 run 段注释)。CI 上停用以稳定门禁; 死代码可本地
    #                 `golangci-lint run -E unused` 或大内存 runner 定期跑。
    - gosimple      # 可简化的写法
    - misspell      # 拼写
    - bodyclose     # HTTP body 未关闭
    - gosec         # 安全问题

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # 测试文件放宽安全/错误检查
    - path: _test\.go
      linters:
        - gosec
        - errcheck
    # 生成代码(gRPC/wire)不检查
    - path: \.pb\.go
      linters:
        - all
    - path: wire_gen\.go
      linters:
        - all
    # gRPC 客户端迁移（DialContext/WithBlock→NewClient、otelgrpc 拦截器→NewClientHandler）
    # 涉及连接语义变化（懒连接、启动即校验连通丢失），需专项验证后再动，暂定向豁免其 SA1019。
    # 其余 SA1019（ChatModel / go-redis）已全部迁移清零。
    - path: internal/infrastructure/grpc/
      text: "SA1019"
      linters:
        - staticcheck

linters-settings:
  gosec:
    excludes:
      - G115  # 整型转换溢出(存量误报多, 单独处理)
