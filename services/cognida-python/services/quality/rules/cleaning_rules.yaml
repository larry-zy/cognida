# 数据清洗规则配置

version: "1.0"

# 文本清洗配置
text_cleaning:
  # 特殊字符去除
  remove_special_chars: true
  control_chars:
    enabled: true
    preserve: ["\n", "\t", " "]

  # HTML标签去除
  remove_html: true
  decode_entities: true

  # 空白字符标准化
  normalize_whitespace: true
  replace_tabs_with_spaces: true
  remove_leading_trailing: true

  # 编码修复
  fix_encoding: false
  target_encoding: "utf-8"

# 去重配置
dedup:
  # 精确去重
  exact_dedup: true
  subset: null  # 指定用于去重的列，null表示使用所有列
  keep: "first"  # first, last, false

  # 模糊去重
  fuzzy_dedup: false
  text_column: "content"
  similarity_threshold: 0.85
  algorithm: "minhash"  # minhash, cosine
  num_perm: 128

# 去噪配置
denoising:
  # 广告去除
  remove_ads: true
  ad_patterns:
    - "点击.{0,5}领取"
    - "扫码.{0,5}关注"
    - "加微信.{0,5}咨询"
    - "限时.{0,5}优惠"
    - "立即.{0,5}购买"
    - "免费.{0,5}试用"

  # 垃圾内容去除
  remove_junk: true
  junk_patterns:
    - "(.)\\1{10,}"  # 重复字符
    - "[！!]{5,}"     # 多个感叹号
    - "[？?]{5,}"     # 多个问号

  # 模板内容去除
  remove_boilerplate: false
  boilerplate_patterns:
    - "^转载.*来源"
    - "^版权所有"
    - "^免责声明"

  # 应用列
  text_column: "content"

# 格式转换配置
format_conversion:
  # 编码转换
  convert_encoding: false
  target_encoding: "utf-8"
  text_columns: []

  # 日期格式标准化
  normalize_dates: false
  date_columns: []
  target_format: "%Y-%m-%d"

  # 数字格式标准化
  normalize_numbers: false
  number_columns: []

# PII脱敏配置
pii_masking:
  # 手机号脱敏
  mask_phone: true
  phone_pattern: "1[3-9]\\d{9}"
  mask_format: "***{last4}"  # 或 "{first3}****{last4}"

  # 邮箱脱敏
  mask_email: true
  mask_format: "{first}***@{domain}"

  # 身份证号脱敏
  mask_id_card: true
  id_card_pattern: "[1-9]\\d{5}(18|19|20)\\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\\d|3[01])\\d{3}[\\dXx]"
  mask_format: "{first6}********{last4}"

  # 应用列
  text_column: "content"

# 元数据
metadata:
  description: "数据清洗规则配置"
  author: "Cognida Team"
