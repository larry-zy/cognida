# 默认质量规则配置

version: "1.0"

# 字段规则
field_rules:
  - name: id
    type: integer
    required: true
    description: 主键ID

  - name: name
    type: string
    required: true
    min_length: 1
    max_length: 100
    description: 名称

  - name: email
    type: string
    pattern: "^[a-z0-9._%+-]+@[a-z0-9.-]+\\.[a-z]{2,}$"
    description: 邮箱地址

  - name: phone
    type: string
    pattern: "^1[3-9]\\d{9}$"
    description: 手机号

  - name: age
    type: integer
    min_value: 0
    max_value: 150
    description: 年龄

  - name: score
    type: float
    min_value: 0
    max_value: 100
    description: 分数

  - name: created_at
    type: datetime
    description: 创建时间

  - name: status
    type: string
    allowed_values: ["active", "inactive", "pending"]
    description: 状态

# 维度规则
dimension_rules:
  - name: completeness
    enabled: true
    threshold: 80
    weight: 1.0

  - name: accuracy
    enabled: true
    threshold: 80
    weight: 1.0

  - name: consistency
    enabled: true
    threshold: 80
    weight: 1.0

  - name: validity
    enabled: true
    threshold: 80
    weight: 1.0

  - name: uniqueness
    enabled: true
    threshold: 90
    weight: 1.0

  - name: timeliness
    enabled: true
    threshold: 70
    weight: 1.0

# 清洗规则
cleaning_rules:
  text_cleaning:
    remove_special_chars: true
    remove_html: true
    normalize_whitespace: true

  dedup:
    exact_dedup: true
    fuzzy_dedup: false
    similarity_threshold: 0.85

  denoising:
    remove_ads: true
    remove_junk: true
    remove_boilerplate: false

  pii_masking:
    mask_phone: true
    mask_email: true
    mask_id_card: true

# 元数据
metadata:
  description: "默认质量规则配置"
  author: "Cognida Team"
  created_at: "2024-01-01"
