[pytest]
# Pytest配置文件 - 质量服务测试

# 测试发现
python_files = test_*.py
python_classes = Test* *Tests
python_functions = test_*

# 测试路径
testpaths = tests/quality

# 输出选项
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# 标记定义
markers =
    slow: 慢速测试（大数据集、性能测试）
    integration: 集成测试（需要多个组件协作）
    unit: 单元测试（单个组件测试）

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 最小Python版本
pythonpath = .
