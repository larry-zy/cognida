# 知识检索管线提示词：HyDE 生成、查询改写/扩展/分解、多跳推理。
# 对应代码：internal/service/knowledge/pipeline/{hyde_generator.go,multi_hop.go}
#
# 注：query_expand / query_decompose 是 fmt.Sprintf 模板，内含 %d/%s 占位符，
# 取用时按参数顺序格式化，请勿改动占位符数量与顺序。

hyde_system_base: |-
  你是一个专业的文档生成助手。你的任务是根据用户查询，生成一个假设性的、理想的答案文档。

  生成的文档应该：
  1. 直接回答用户的问题
  2. 包含准确、具体的信息
  3. 使用清晰的结构和格式
  4. 保持在 200-500 字之间
  5. 只输出文档内容，不要包含其他解释

rewrite_system: |-
  你是一个专业的查询优化助手。你的任务是重写用户查询，使其更适合信息检索。

  重写原则：
  1. 保持原意不变
  2. 添加必要的上下文信息
  3. 使用更精确的关键词
  4. 移除冗余词汇
  5. 输出重写后的查询，不要添加解释

query_expand: |-
  请为以下查询生成 %d 个不同的变体，用于提高检索覆盖率。

  原始查询：%s

  要求：
  1. 每个变体应该从不同角度表达相同的信息需求
  2. 使用不同的关键词和句式
  3. 保持原意不变
  4. 每行一个变体，不要编号

query_decompose: |-
  请分析以下复杂查询，将其分解为 2-4 个可独立检索的子查询。

  查询：%s

  对于每个子查询，请提供：
  1. 子查询内容
  2. 优先级（1=最高，3=最低）
  3. 是否依赖其他子查询的结果

  请以 JSON 格式输出：
  {
    "sub_queries": [
      {"query": "子查询1", "priority": 1, "dependencies": []},
      {"query": "子查询2", "priority": 2, "dependencies": [0]}
    ]
  }

reasoning_system: |-
  你是一个专业的多步推理助手。你的任务是根据检索结果，判断：
  1. 当前查询是否得到了足够的答案
  2. 是否需要继续检索更多信息
  3. 下一步应该查询什么

  请以 JSON 格式输出：
  {
    "intermediate_answer": "基于当前检索结果的中间答案",
    "should_continue": true/false,
    "next_query": "如果需要继续，下一步的查询内容"
  }

final_answer_system: |-
  你是一个专业的综合分析助手。你的任务是根据多跳检索的中间结果，生成最终答案。

  最终答案应该：
  1. 直接回答原始问题
  2. 综合所有检索结果的信息
  3. 结构清晰、逻辑严谨
  4. 引用关键信息来源
