name: Architecture Check

on:
  pull_request:
    paths:
      - 'internal/**'
      - 'cmd/**'
      - '.github/workflows/architecture-check.yml'
  push:
    branches: [ main, develop ]

jobs:
  architecture:
    name: Check Architecture Violations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download dependencies
        run: |
          go mod download
          go get golang.org/x/tools/go/packages

      - name: Run architecture check
        id: archcheck
        run: |
          go run cmd/archcheck/main.go
        continue-on-error: true

      - name: Fail on violations
        if: steps.archcheck.outcome == 'failure'
        run: |
          echo "❌ Architecture violations detected!"
          echo ""
          echo "This PR contains Clean Architecture violations that must be fixed before merging."
          echo ""
          echo "Please run 'go run cmd/archcheck/main.go' locally to see the violations."
          exit 1

      - name: Comment on PR (if violations found)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## ❌ Architecture Violations Detected\n\n' +
                    'This PR introduces architecture violations. Please run `go run cmd/archcheck/main.go` locally to see and fix the violations.\n\n' +
                    'Common fixes:\n' +
                    '1. Define interfaces in domain layer instead of importing infrastructure\n' +
                    '2. Use dependency injection to provide infrastructure implementations\n' +
                    '3. Ensure dependencies follow: Interface → Application → Domain ← Infrastructure'
            })
