name: CI - Web

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/cognida-web/**'
      - 'services/cognida-go/internal/model/**'
      - 'services/cognida-go/cmd/frontend-contracts/**'
      - '.github/workflows/ci-web.yml'
  pull_request:
    paths:
      - 'apps/cognida-web/**'
      - 'services/cognida-go/internal/model/**'
      - 'services/cognida-go/cmd/frontend-contracts/**'
      - '.github/workflows/ci-web.yml'

defaults:
  run:
    working-directory: apps/cognida-web

jobs:
  check:
    name: 检查与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: services/cognida-go/go.mod
          cache-dependency-path: services/cognida-go/go.sum

      - name: 检查生成的前端契约
        working-directory: services/cognida-go
        run: go run ./cmd/frontend-contracts -check

      - name: 设置 Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/cognida-web/package-lock.json

      - name: 安装依赖
        run: npm ci

      # Errors block merges; existing warnings remain visible without disabling the gate.
      - name: ESLint
        run: npm run lint

      - name: 类型检查
        run: npm run type-check

      - name: 单元测试
        run: npm run test

      - name: 构建
        run: npm run build

      - name: E2E 类型检查
        run: npm run test:e2e:check

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      # This is a deterministic browser regression gate. API responses are
      # fixtures; it does not replace the real-service acceptance suite.
      - name: 页面竞态与完成状态回归（API fixture）
        env:
          COGNIDA_FIXTURE_BASE_URL: http://127.0.0.1:62813
          COGNIDA_FIXTURE_BROWSER: chromium
        run: |
          npm run dev -- --host 127.0.0.1 --port 62813 --strictPort > /tmp/cognida-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:62813/ > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:62813/ > /dev/null
          npm run test:e2e:fixture

      - name: 保存页面回归失败证据
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-fixture-failure
          path: apps/cognida-web/test-results-fixture
          if-no-files-found: ignore
