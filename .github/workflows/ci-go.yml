name: CI - Go

# monorepo 说明: 本仓库为单一 git 仓库, GitHub Actions 只读仓库根的
# .github/workflows/。原先放在 services/cognida-go/.github/ 下的 workflow 永不触发,
# 故统一上移至根级, 用 paths 过滤 + working-directory 定位子服务。

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/cognida-go/**'
      - '.github/workflows/ci-go.yml'
  pull_request:
    paths:
      - 'services/cognida-go/**'
      - '.github/workflows/ci-go.yml'

defaults:
  run:
    working-directory: services/cognida-go

jobs:
  build-test:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 设置 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/cognida-go/go.mod
          cache: true
          cache-dependency-path: services/cognida-go/go.sum

      - name: 下载依赖
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: 构建
        run: go build -o bin/cognida ./cmd/server

      - name: 单元测试 (-short -race)
        run: go test -short -race -coverprofile=coverage.out -covermode=atomic ./...

  lint:
    name: 代码检查 (golangci-lint)
    runs-on: ubuntu-latest
    # 棕地存量已清零(91 个真实问题全部修复 + grpc SA1019 专项豁免待迁移), 转为硬门禁。
    steps:
      - uses: actions/checkout@v5

      - name: 设置 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/cognida-go/go.mod
          cache: true
          cache-dependency-path: services/cognida-go/go.sum

      # 用 go install 从源码现编 golangci-lint(而非下载官方 go1.24 预编译二进制): 关键根因修复——
      # 官方 v1.64.8 由 go1.24 构建, 分析本仓库 go1.25 代码时读不了 go1.25 的 export data, 退化为
      # 整棵依赖闭包源码内联类型检查 + 全 SSA 驻留 → 峰值 ~15-16GB 顶死 16GB runner。用 setup-go 装的
      # go1.25 现编后, golangci-lint 版本与工具链对齐、复用 export data, 峰值回落到 ~2GB。版本仍钉 v1.64.8。
      - name: 安装 golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      # 预热 module 与编译缓存: 冷 GOCACHE 下 golangci-lint 会自行编译整棵依赖树取 export data,
      # 内存/耗时不可控(疑为 CI 卡死主因); 先 go build ./... 把结果落进 GOCACHE 让 lint 直接复用。
      - name: 预热依赖与编译缓存
        run: |
          go mod download
          go build ./...

      # 旁路每 10s 把内存采样直接打到 stdout(实时流式): 即使 runner 被 OS-OOM 杀死,
      # 已 flush 的行也会留在 step 日志里, 可读到爬升峰值坐实 OOM(写文件+末尾 cat 的做法在 OOM 时丢失)。
      # GOMEMLIMIT=14GiB 仅对可回收垃圾有效; 外层 coreutils timeout 24m 作硬墙兜底 hang。
      - name: golangci-lint
        env:
          GOMEMLIMIT: "14GiB"
        run: |
          ( while true; do printf '[MEM] %s ' "$(date +%T)"; free -m | awk '/Mem:/{printf "used=%sMB avail=%sMB\n",$3,$7}'; sleep 10; done ) &
          MON=$!
          set +e
          timeout --signal=KILL --kill-after=20s 12m \
            "$(go env GOPATH)/bin/golangci-lint" run --verbose --timeout=10m ./...
          RC=$?
          set -e
          kill "$MON" 2>/dev/null || true
          echo "===== golangci-lint exit=$RC (124/137=timeout 硬墙触发) ====="
          exit $RC

  vuln:
    name: 漏洞扫描 (govulncheck)
    runs-on: ubuntu-latest
    # 存量可达漏洞已清零: 升级 grpc / x/text / excelize / quic-go / etcd 等依赖并将 go 版本钉到
    # 1.25.13(覆盖 crypto/tls 等 stdlib 补丁 + etcd server ≥3.5.33)后, govulncheck 对"可达"漏洞报告为空。
    # govulncheck 只报告调用链真正触及的漏洞, 误报极低; 故转为硬门禁,
    # 与本仓库 golangci-lint / ruff / mypy / safety / bandit 的"存量先反馈、清零后转门禁"一致。
    steps:
      - uses: actions/checkout@v5

      - name: 设置 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/cognida-go/go.mod
          cache: true
          cache-dependency-path: services/cognida-go/go.sum

      - name: 安装 govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...

  architecture:
    name: 架构合规检查
    runs-on: ubuntu-latest
    # 修正 import 前缀(link→cognida)后校验真正生效, 暴露的历史越界已清零:
    #   - handler→infrastructure/cache: 限流器装配上移组合根(cmd/server), 经 Setup 注入;
    #   - service→infrastructure/reliability: 熔断器归类为横切容错原语(与 config/id/observability
    #     同列于脚本 allow_crosscutting), 见〔X-4〕。
    # 现转为硬门禁, 与仓库"存量先反馈、清零后转门禁"一致。
    steps:
      - uses: actions/checkout@v5

      # 架构校验脚本纳入仓库(services/cognida-go/scripts/), 作为单一事实源;
      # 脚本以自身位置推导 GO_ROOT, 与 cwd 无关。
      - name: 检查 Clean Architecture 依赖方向
        run: bash scripts/check-architecture.sh
