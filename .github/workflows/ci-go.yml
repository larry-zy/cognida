name: CI - Go

# monorepo 说明: 本仓库为单一 git 仓库, GitHub Actions 只读仓库根的
# .github/workflows/。原先放在 services/cognida-go/.github/ 下的 workflow 永不触发,
# 故统一上移至根级, 用 paths 过滤 + working-directory 定位子服务。

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/cognida-go/**'
      - '.github/workflows/ci-go.yml'
  pull_request:
    paths:
      - 'services/cognida-go/**'
      - '.github/workflows/ci-go.yml'

defaults:
  run:
    working-directory: services/cognida-go

jobs:
  build-test:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 设置 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/cognida-go/go.mod
          cache: true
          cache-dependency-path: services/cognida-go/go.sum

      - name: 下载依赖
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: 构建
        run: go build -o bin/cognida ./cmd/server

      - name: 单元测试 (-short -race)
        run: go test -short -race -coverprofile=coverage.out -covermode=atomic ./...

  lint:
    name: 代码检查 (golangci-lint)
    runs-on: ubuntu-latest
    # 棕地存量已清零(91 个真实问题全部修复 + grpc SA1019 专项豁免待迁移), 转为硬门禁。
    steps:
      - uses: actions/checkout@v5

      - name: 设置 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/cognida-go/go.mod
          cache: true
          cache-dependency-path: services/cognida-go/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        # 16GB runner 上全程序分析易 OOM: 给 golangci-lint 进程设内存软上限,
        # 逼近时主动 GC 而非被内核 OOM-kill; GOGC 调低进一步压低堆高水位。
        env:
          GOMEMLIMIT: "12GiB"
          GOGC: "50"
        with:
          version: latest
          working-directory: services/cognida-go

  vuln:
    name: 漏洞扫描 (govulncheck)
    runs-on: ubuntu-latest
    # 存量可达漏洞已清零: 升级 grpc / x/text / excelize / quic-go / etcd 等依赖并将 go 版本钉到
    # 1.25.12(修复 crypto/tls ECH 漏洞 GO-2026-5856)后, govulncheck 对"可达"漏洞报告为空。
    # govulncheck 只报告调用链真正触及的漏洞, 误报极低; 故转为硬门禁,
    # 与本仓库 golangci-lint / ruff / mypy / safety / bandit 的"存量先反馈、清零后转门禁"一致。
    steps:
      - uses: actions/checkout@v5

      - name: 设置 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/cognida-go/go.mod
          cache: true
          cache-dependency-path: services/cognida-go/go.sum

      - name: 安装 govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...

  architecture:
    name: 架构合规检查
    runs-on: ubuntu-latest
    # 修正 import 前缀(link→cognida)后校验真正生效, 暴露的历史越界已清零:
    #   - handler→infrastructure/cache: 限流器装配上移组合根(cmd/server), 经 Setup 注入;
    #   - service→infrastructure/reliability: 熔断器归类为横切容错原语(与 config/id/observability
    #     同列于脚本 allow_crosscutting), 见〔X-4〕。
    # 现转为硬门禁, 与仓库"存量先反馈、清零后转门禁"一致。
    steps:
      - uses: actions/checkout@v5

      # 架构校验脚本纳入仓库(services/cognida-go/scripts/), 作为单一事实源;
      # 脚本以自身位置推导 GO_ROOT, 与 cwd 无关。
      - name: 检查 Clean Architecture 依赖方向
        run: bash scripts/check-architecture.sh
