name: CI - 安全扫描

# 仓库级密钥扫描门（〔INF-13〕）：gitleaks 扫描全部提交历史，拦截真实凭证泄漏。
# 已核实的示例/测试假密钥经仓库根 .gitleaksignore 允许清单排除，故本门为阻断门禁
# （区别于 Go/Python CI 内部的存量非阻断扫描器）。

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  gitleaks:
    name: 密钥扫描 (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 全提交历史，gitleaks detect 需完整 git log

      - name: 安装 gitleaks
        run: |
          VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: gitleaks detect（提交历史 + 允许清单）
        # gitleaks 默认读取仓库根 .gitleaksignore 允许清单；发现未列入清单的密钥即以非零退出阻断。
        run: gitleaks detect --redact --no-banner --exit-code 1
